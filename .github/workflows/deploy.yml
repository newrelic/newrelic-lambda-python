---
name: Deploy

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build wheels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: "3.14"
          architecture: x64

      - name: Install Dependencies
        run: |
          pip install -U pip
          pip install -U build

      - name: Build Package
        run: |
          python -m build

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: dist
          path: |
            ./dist/*.tar.gz
            ./dist/*.whl
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      attestations: write
      artifact-metadata: write
    needs:
      - build

    strategy:
      matrix:
        pypi-instance:
          - pypi
          # Valid values for deployment are:
          # - "pypi" for production
          # - "testpypi" for testing
          # - "build-only" to skip publishing and only test builds.

    environment: ${{ matrix.pypi-instance }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: dist
          path: ./dist/

      - name: Upload Package to PyPI
        if: matrix.pypi-instance == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # 1.14.2

      - name: Upload Package to TestPyPI
        if: matrix.pypi-instance == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # 1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # 4.2.2
        id: attest
        with:
          subject-path: |
            ./dist/*.whl
            ./dist/*.tar.gz
