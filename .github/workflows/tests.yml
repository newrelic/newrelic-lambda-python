name: Tests

on:
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    if: always() # Always run, even on cancellation or failure
    needs:
      - python
    steps:
      - name: Status
        run: |
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Workflow cancelled."
            exit 1
          elif [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more jobs failed."
            exit 1
          else
            echo "All jobs completed successfully."
            exit 0
          fi

  # Combine and upload coverage data
  coverage:
    runs-on: ubuntu-24.04
    # Don't run this job if triggered by Dependabot, but otherwise run it regardless of success or failure
    if: ${{ (github.actor != 'dependabot[bot]') && (success() || failure()) }} # Does not run on cancelled workflows
    needs:
      - tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: "3.13"
          architecture: x64

      - name: Download Coverage Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          pattern: coverage-*
          path: ./

      - name: Combine Coverage
        run: |
          pip install coverage
          find . -name ".coverage.*" -exec mv {} ./ \;
          coverage combine
          coverage xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # 7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Run Tests
  python:
    strategy:
      fail-fast: False
      matrix:
        python:
          - version: "3.9"
            tox-prefix: py39
          - version: "3.10"
            tox-prefix: py310
          - version: "3.11"
            tox-prefix: py311
          - version: "3.12"
            tox-prefix: py312
          - version: "3.13"
            tox-prefix: py313
          - version: "3.14"
            tox-prefix: py314

    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 7.0.0
        with:
          python-version: ${{ matrix.python.version }}
          architecture: x64

      - name: Install Dependencies
        run: |
          pip install -U pip
          pip install -U wheel setuptools tox

      - name: Test
        run: |
          tox run \
            -v -e ${{ matrix.python.tox-prefix }} \
            --result-json=./.tox/${{ github.job }}-${{ matrix.python.tox-prefix }}-${{ github.run_id }}-${{ job.check_run_id }}-results.json \
            --exit-and-dump-after=900
        env:
          TOX_PARALLEL_NO_SPINNER: 1
          FORCE_COLOR: "true"

      - name: Upload Coverage Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        if: always()
        with:
          name: coverage-${{ github.job }}-${{ strategy.job-index }}
          path: ./**/.coverage.*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload Results Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        if: always()
        with:
          name: results-${{ github.job }}-${{ strategy.job-index }}
          path: ./.tox/*-results.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
